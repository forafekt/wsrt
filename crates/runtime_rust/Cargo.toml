# crates/runtime_rust/Cargo.toml

[package]
name = "wsrt-runtime"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wsrt-runtime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
libc = "0.2"
