projects:
  build:
    root: .
    adapter: node
    command: pnpm -r build
    environment:
      NODE_ENV: ${runtime.environment}
  release:
    root: .
    adapter: node
    command: pnpm -r release
    environment:
      NODE_ENV: ${runtime.environment}
  pack:
    root: .
    adapter: node
    command: pnpm -r pack
    environment:
      NODE_ENV: ${runtime.environment}
  publish:
    root: .
    adapter: node
    command: pnpm -r publish
    environment:
      NODE_ENV: ${runtime.environment}
workspace:
  packages:
    - ./packages/*
graph:
  includeExternal: false
analyze:
  circularDependencies: true
  deadPackages: true
  deadExports: true
  missingDependencies: true
  duplicateDependencies: true
  versionDrift: true
  importStyle: true
  health: true
  impact: true
imports:
  validateRelativeWorkspaceImports: true
  fixRelativeWorkspaceImports: false
artifacts:
  dir: ./.vitem
  report: true
  graph: true
  packages: true
  aliases: true
  diagnostics: true
mcp:
  enabled: true
  name: activelane-vitem
  exposeSourcePaths: true
  exposeReports: true
  exposeDiagnostics: true
  maxResults: 100
tsconfig:
  enabled: true
  mode: check
  paths: true
  root: false
  projects: true
manifests:
  enabled: true
  mode: check
  targets:
    - package-json
report:
  file: ./.vitem/report.json
  pretty: true
plugins:
  - "@wsrt/plugin-dashboard?enabled=true&host=0.0.0.0&port=5177&path=/wsrt"
  - "@wsrt/plugin-git"
  - "@wsrt/plugin-typescript"
  - "@wsrt/plugin-workspace"
