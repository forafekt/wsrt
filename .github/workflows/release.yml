name: Release npm packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm release:check
      - run: pnpm release:pack
      - run: pnpm external-consumer:test
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: .release/tarballs/*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:pack
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Publish reviewed tarballs
        run: WSRT_RELEASE_CONFIRM="$(node -p "require('./package.json').version")" pnpm release:publish
